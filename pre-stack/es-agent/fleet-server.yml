fleet:
  agent:
    id: fleet-server-agent
  enabled: true
  server:
    enable: true
    host: "0.0.0.0"
    port: 8220
    elasticsearch:
      host: "https://elasticsearch:9200"
      username: "elastic"
      password: "elastic"
      ca: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
    ssl:
      certificate: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.crt"
      key: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.key"
    policy_id: "fleet-server-policy"

kibana:
  host: "https://kibana:5601"
  username: "elastic"
  password: "elastic"
  ssl.certificate_authorities: ["/usr/share/elastic-agent/config/certs/ca/ca.crt"]