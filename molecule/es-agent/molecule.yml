---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    ignore-certs: true
    ignore-errors: true

driver:
  name: docker

platforms:
  # Setup container for initial configuration
  - name: elastic-setup
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elastic-setup
    user: "0"
    entrypoint: []
    working_dir: /usr/share/elasticsearch
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env
        bash -x /usr/share/elasticsearch/pre-stack/elastic-stack-init.sh
        sleep 5
      '
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/elasticsearch/elasticsearch.crt"]
      interval: 1s
      timeout: 5s
      retries: 120
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic

  # Elasticsearch container
  - name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elasticsearch
    depends_on:
      elastic-setup:
        condition: service_healthy    
    entrypoint: []
    working_dir: /usr/share/elasticsearch    
    command: |
      bash -c '
        # Wait for setup container
        until [ -f /usr/share/elasticsearch/config/certs.ro/elasticsearch/elasticsearch.crt ] && [ -f /usr/share/elasticsearch/config/certs.ro/setup.complete ]; do
          echo "Waiting for certificates..."
          sleep 5
        done

        sleep 10

        # Source the env file
        ENV_FILE="/usr/share/elasticsearch/pre-stack/es-agent/.env"
        if [ -f "$ENV_FILE" ]; then
          echo "Sourcing environment file: $ENV_FILE"
          source "$ENV_FILE"
        else
          echo "Warning: Environment file not found at $ENV_FILE"
        fi

        # Set default password if ELASTIC_PASSWORD is empty
        if [ -z "$ELASTIC_PASSWORD" ]; then
          echo "ELASTIC_PASSWORD is not set, using default password"
          export ELASTIC_PASSWORD="elastic"
        else
          echo "Using provided ELASTIC_PASSWORD"
        fi

        # Create new keystore
        /usr/share/elasticsearch/bin/elasticsearch-keystore create --silent

        # Set bootstrap password
        echo "Adding ES Password: ${ELASTIC_PASSWORD} to the bootstrap.password keystore"
        # echo "${ELASTIC_PASSWORD}" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password
        echo "elastic" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password

        # Verify keystore
        /usr/share/elasticsearch/bin/elasticsearch-keystore list        

        exec /usr/local/bin/docker-entrypoint.sh elasticsearch -Expack.security.autoconfiguration.enabled=false \
          -Expack.security.enabled=true \
          -Expack.security.http.ssl.enabled=true \
          -Expack.security.http.ssl.key=certs.ro/elasticsearch/elasticsearch.key \
          -Expack.security.http.ssl.certificate=certs.ro/elasticsearch/elasticsearch.crt \
          -Expack.security.http.ssl.certificate_authorities=certs.ro/ca/ca.crt \
          -Expack.security.http.ssl.verification_mode=certificate \
          -Expack.security.transport.ssl.enabled=true \
          -Expack.security.transport.ssl.key=certs.ro/elasticsearch/elasticsearch.key \
          -Expack.security.transport.ssl.certificate=certs.ro/elasticsearch/elasticsearch.crt \
          -Expack.security.transport.ssl.certificate_authorities=certs.ro/ca/ca.crt \
          -Expack.security.transport.ssl.verification_mode=certificate \
          -Elicense.self_generated.type=trial \
          -Epath.data=/usr/share/elasticsearch/data \
          -Epath.logs=/usr/share/elasticsearch/logs \
          -Ediscovery.type=single-node \
          -Enetwork.host=0.0.0.0 \
          -Ebootstrap.memory_lock=true \
          -Ecluster.name=docker-cluster \
          -Enode.name=elasticsearch
      '
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/elasticsearch/elasticsearch.crt"]
      interval: 1s
      timeout: 5s
      retries: 120    
    volumes:
      - 'certs:/usr/share/elasticsearch/config/certs.ro:ro'
      - '/workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack/es-agent:ro'
    networks:
      - name: elastic
    ports:
      - "9200:9200"

  - name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.2
    pre_build_image: true
    hostname: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: []
    working_dir: /usr/share/kibana
    command: >-
      bash -c '
        sleep infinity
        bash -x /usr/share/elasticsearch/pre-stack/kibana-startup.sh
        sleep 5
      '
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/kibana/pre-stack/es-agent:ro
    mem_limit: ${MEM_LIMIT:-512m}
    published_ports:
      - 0.0.0.0:5601:5601/tcp  
    networks:
      - name: elastic
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I --cacert config/certs/ca/ca.crt https://kibana:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Fleet Server container
  - name: fleet-server
    image: docker.elastic.co/beats/elastic-agent:8.15.2
    pre_build_image: true
    hostname: fleet-server
    user: root
    volumes:
      - certs:/usr/share/elastic-agent/config/certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elastic-agent/pre-stack/es-agent:ro
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_CERT=/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.key
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-elastic}
      - ELASTICSEARCH_CA=/usr/share/elastic-agent/config/certs/ca/ca.crt
      - KIBANA_FLEET_HOST=https://kibana:5601
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=${ELASTIC_PASSWORD:-elastic}
      - KIBANA_FLEET_CA=/usr/share/elastic-agent/config/certs/ca/ca.crt
    command: elastic-agent container
    ports:
      - "8220:8220"
    networks:
      - name: elastic
    depends_on:
      - elasticsearch
      - kibana
  # Test instance for es-agent deployment
  - name: instance
    image: geerlingguy/docker-ubuntu2004-ansible
    pre_build_image: true
    privileged: true
    packages:
      - python3
      - python3-pip
      - curl
      - ca-certificates
    command: |
      bash -c '
        apt update 
        apt install -y curl
        sleep infinity
      '
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic
    groups:
      - elastic_agents
    depends_on:
      - elasticsearch
      - kibana
      - fleet-server

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  inventory:
    group_vars:
      all:
        elastic_password: "{{ lookup('env', 'ELASTIC_PASSWORD') }}"
        kibana_password: "{{ lookup('env', 'KIBANA_PASSWORD') }}"
        fleet_host: "{{ lookup('env', 'FLEET_HOST') }}"
        es_host: "{{ lookup('env', 'ELASTICSEARCH_HOST') }}"
        kibana_host: "{{ lookup('env', 'KIBANA_FLEET_HOST') }}"
        ca_cert: "{{ lookup('env', 'CA_CERT') }}"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    # - cleanup
    - destroy
    - create
    - prepare
    - converge
