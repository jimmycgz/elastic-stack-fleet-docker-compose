---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    ignore-certs: true
    ignore-errors: true

driver:
  name: docker

platforms:
  # Setup container for initial configuration
  - name: elastic-setup
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elastic-setup
    user: "0"
    entrypoint: []
    working_dir: /usr/share/elasticsearch
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env
        bash -x /usr/share/elasticsearch/pre-stack/elastic-stack-init.sh
        sleep 5
      '
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/elasticsearch/elasticsearch.crt"]
      interval: 1s
      timeout: 5s
      retries: 120
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic

  # Elasticsearch container
  - name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elasticsearch
    depends_on:
      elastic-setup:
        condition: service_healthy    
    entrypoint: []
    working_dir: /usr/share/elasticsearch    
    command: |
      bash -c '
        # Create a temporary directory for certificates
        mkdir -p /usr/share/elasticsearch/config/certs.temp
        
        # Wait for certificates
        until [ -f /usr/share/elasticsearch/config/certs.ro/elasticsearch/elasticsearch.crt ] && [ -f /usr/share/elasticsearch/config/certs.ro/setup.complete ]; do
          echo "Waiting for certificates to be generated..."
          sleep 5
        done

        # Add a small delay after cert detection
        sleep 10

        # Copy certificates to temp directory first
        cp -r /usr/share/elasticsearch/config/certs.ro/* /usr/share/elasticsearch/config/certs.temp/

        # Then move the temp directory to final location
        rm -rf /usr/share/elasticsearch/config/certs
        mv /usr/share/elasticsearch/config/certs.temp /usr/share/elasticsearch/config/certs

        source /usr/share/elasticsearch/pre-stack/.env

        # Create keystore non-interactively
        /usr/share/elasticsearch/bin/elasticsearch-keystore create --silent
        
        # Add bootstrap password non-interactively
        echo "Adding password to the bootstrap.password keystore: ${ELASTIC_PASSWORD}"
        echo "${ELASTIC_PASSWORD}" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password

        # Verify keystore contents
        /usr/share/elasticsearch/bin/elasticsearch-keystore list        
        
        # Convert environment variables to ES settings format
        ES_OPTS="-Expack.security.autoconfiguration.enabled=false \
                -Expack.security.enabled=true \
                -Expack.security.http.ssl.enabled=true \
                -Expack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key \
                -Expack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt \
                -Expack.security.http.ssl.certificate_authorities=certs/ca/ca.crt \
                -Expack.security.http.ssl.verification_mode=certificate \
                -Expack.security.transport.ssl.enabled=true \
                -Expack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key \
                -Expack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt \
                -Expack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt \
                -Expack.security.transport.ssl.verification_mode=certificate \
                -Expack.license.self_generated.type=${LICENSE:-trial} \
                -Epath.data=/usr/share/elasticsearch/data \
                -Epath.logs=/usr/share/elasticsearch/logs \
                -Ediscovery.type=single-node \
                -Enetwork.host=0.0.0.0 \
                -Ebootstrap.memory_lock=true \
                -Ecluster.name=${CLUSTER_NAME:-docker-cluster} \
                -Enode.name=${NODE_NAME:-elasticsearch}"
        
        exec /usr/local/bin/docker-entrypoint.sh elasticsearch ${ES_OPTS}
      '
    privileged: true
    volumes:
      - 'certs:/usr/share/elasticsearch/config/certs.ro:ro'
      - '/workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro'
    networks:
      - name: elastic
    ports:
      - "9200:9200"

  - name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.2
    pre_build_image: true
    hostname: kibana
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env
        
        # Create environment config file
        echo -ne \
        "ELASTICSEARCH_HOSTS=https://elasticsearch:9200\n"\
        "ELASTICSEARCH_USERNAME=kibana_system\n"\
        "ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}\n"\
        "ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt\n"\
        "SERVER_SSL_ENABLED=true\n"\
        "SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/kibana/kibana.crt\n"\
        "SERVER_SSL_KEY=/usr/share/kibana/config/certs/kibana/kibana.key\n"\
        "SERVER_NAME=${KIBANA_SERVER_NAME:-kibana}\n"\
        "XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACK_ENCRYPTEDSAVEDOBJECTS_KEY}\n"\
        "XPACK_FLEET_AGENTS_ENABLED=true\n"\
        "XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=[\"${FLEET_HOST}\"]"\
        "XPACK_ACTIONS_PRECONFIGUREDALERTHISTORYESINDEX=true\n"\
        "XPACK_ACTIONS_PRECONFIGURED={}\n"\
        > /tmp/kibana.env

        # Source the config
        source /tmp/kibana.env

        cp /usr/share/elasticsearch/pre-stack/kibana.yml /usr/share/kibana/config/kibana.yml &&
        /usr/local/bin/kibana-docker
      '
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    mem_limit: ${MEM_LIMIT:-512m}
    published_ports:
      - 0.0.0.0:5601:5601/tcp  
    network_mode: elastic
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I --cacert config/certs/ca/ca.crt https://kibana:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Fleet Server container
  - name: fleet-server
    image: docker.elastic.co/beats/elastic-agent:8.15.2
    pre_build_image: true
    hostname: fleet-server
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env &&
        /usr/local/bin/docker-entrypoint.sh
      '
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    # tmpfs:
      # - /usr/share/elastic-agent/config/certs:uid=0,gid=0
    mem_limit: ${MEM_LIMIT:-512m}
    ports:
      - "${FLEET_PORT:-8220}:8220"
    networks:
      - name: elastic
    depends_on:
      - elasticsearch
      - kibana

  # Test instance for es-agent deployment
  - name: instance
    image: geerlingguy/docker-ubuntu2004-ansible
    pre_build_image: true
    privileged: true
    packages:
      - python3
      - python3-pip
      - curl
      - ca-certificates
    command: |
      bash -c '
        apt update 
        apt install -y curl
        sleep infinity
      '
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic
    groups:
      - elastic_agents
    depends_on:
      - elasticsearch
      - kibana
      - fleet-server

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  inventory:
    group_vars:
      all:
        elastic_password: "{{ lookup('env', 'ELASTIC_PASSWORD') }}"
        kibana_password: "{{ lookup('env', 'KIBANA_PASSWORD') }}"
        fleet_host: "{{ lookup('env', 'FLEET_HOST') }}"
        es_host: "{{ lookup('env', 'ELASTICSEARCH_HOST') }}"
        kibana_host: "{{ lookup('env', 'KIBANA_FLEET_HOST') }}"
        ca_cert: "{{ lookup('env', 'CA_CERT') }}"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    # - cleanup
    - destroy
    - create
    - prepare
    - converge
