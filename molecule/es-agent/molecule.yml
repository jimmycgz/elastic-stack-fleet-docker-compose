---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    ignore-certs: true
    ignore-errors: true

driver:
  name: docker

platforms:
  # Setup container for initial configuration
  - name: elastic-setup
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elastic-setup
    user: "0"
    entrypoint: []
    working_dir: /usr/share/elasticsearch
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env
        bash -x /usr/share/elasticsearch/pre-stack/elastic-stack-init.sh
      '
    volumes:
      - ./shared-certs:/usr/share/elasticsearch/config/certs:rw
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    network_mode: elastic

  # Elasticsearch container
  - name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elasticsearch
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env &&
        rm -rf /usr/share/elasticsearch/config/certs &&
        cp -r /usr/share/elasticsearch/shared-certs /usr/share/elasticsearch/config/certs &&
        chown -R elasticsearch:root /usr/share/elasticsearch/config/certs &&
        echo "Starting Elasticsearch manually" &&
        /usr/local/bin/docker-entrypoint.sh
      '
    volumes:
      - ./shared-certs:/usr/share/elasticsearch/shared-certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    tmpfs:
      - /usr/share/elasticsearch/config/certs:uid=1000,gid=0
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: single-node
    mem_limit: ${MEM_LIMIT:-1g}
    ports:
      - "${ES_PORT:-9200}:9200"
    network_mode: elastic

  - name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.2
    pre_build_image: true
    hostname: kibana
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env &&
        rm -rf /usr/share/kibana/config/certs &&
        cp -r /usr/share/kibana/shared-certs /usr/share/kibana/config/certs &&
        chown -R kibana:root /usr/share/kibana/config/certs &&
        /usr/local/bin/kibana-docker
      '
    volumes:
      - ./shared-certs:/usr/share/kibana/shared-certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    tmpfs:
      - /usr/share/kibana/config/certs:uid=1000,gid=0
    mem_limit: ${MEM_LIMIT:-512m}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    network_mode: elastic
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I --cacert config/certs/ca/ca.crt https://kibana:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Fleet Server container
  - name: fleet-server
    image: docker.elastic.co/beats/elastic-agent:8.15.2
    pre_build_image: true
    hostname: fleet-server
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env &&
        rm -rf /usr/share/elastic-agent/config/certs &&
        cp -r /usr/share/elastic-agent/shared-certs /usr/share/elastic-agent/config/certs &&
        chown -R root:root /usr/share/elastic-agent/config/certs &&
        /usr/local/bin/docker-entrypoint.sh
      '
    volumes:
      - ./shared-certs:/usr/share/elastic-agent/shared-certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    tmpfs:
      - /usr/share/elastic-agent/config/certs:uid=0,gid=0
    mem_limit: ${MEM_LIMIT:-512m}
    ports:
      - "${FLEET_PORT:-8220}:8220"
    network_mode: elastic
    depends_on:
      - elasticsearch
      - kibana

  # Test instance for es-agent deployment
  - name: instance
    image: geerlingguy/docker-ubuntu2004-ansible
    pre_build_image: true
    privileged: true
    packages:
      - python3
      - python3-pip
      - curl
      - ca-certificates
    volumes:
      - ./shared-certs:/usr/share/elastic-agent/shared-certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    tmpfs:
      - /usr/share/elastic-agent/config/certs:uid=0,gid=0
    network_mode: elastic
    groups:
      - elastic_agents
    depends_on:
      - elasticsearch
      - kibana
      - fleet-server

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  inventory:
    group_vars:
      all:
        elastic_password: "{{ lookup('env', 'ELASTIC_PASSWORD') }}"
        kibana_password: "{{ lookup('env', 'KIBANA_PASSWORD') }}"
        fleet_host: "{{ lookup('env', 'FLEET_HOST') }}"
        es_host: "{{ lookup('env', 'ELASTICSEARCH_HOST') }}"
        kibana_host: "{{ lookup('env', 'KIBANA_FLEET_HOST') }}"
        ca_cert: "{{ lookup('env', 'CA_CERT') }}"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - prepare
    - converge
