---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    ignore-certs: true
    ignore-errors: true

driver:
  name: docker

platforms:
  # Setup container for initial configuration
  - name: elastic-setup
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elastic-setup
    user: "0"
    entrypoint: []
    working_dir: /usr/share/elasticsearch
    command: |
      bash -c '
        source /usr/share/elasticsearch/pre-stack/.env
        bash -x /usr/share/elasticsearch/pre-stack/elastic-stack-init.sh
        sleep 5
      '
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/elasticsearch/elasticsearch.crt"]
      interval: 1s
      timeout: 5s
      retries: 120
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic

  # Elasticsearch container
  - name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    pre_build_image: true
    hostname: elasticsearch
    entrypoint: []
    working_dir: /usr/share/elasticsearch    
    env:
      # Basic settings
      node.name: elasticsearch
      cluster.name: docker-cluster
      # cluster.initial_master_nodes: elasticsearch
      discovery.type: single-node
      network.host: "0.0.0.0"
      bootstrap.memory_lock: "true"
      path.data: "/usr/share/elasticsearch/data"
      path.logs: "/usr/share/elasticsearch/logs"
      
      # Security settings
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: "certs.ro/elasticsearch/elasticsearch.key"
      xpack.security.http.ssl.certificate: "certs.ro/elasticsearch/elasticsearch.crt"
      xpack.security.http.ssl.certificate_authorities: "certs.ro/ca/ca.crt"
      xpack.security.http.ssl.verification_mode: certificate
      
      # Transport security
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: "certs.ro/elasticsearch/elasticsearch.key"
      xpack.security.transport.ssl.certificate: "certs.ro/elasticsearch/elasticsearch.crt"
      xpack.security.transport.ssl.certificate_authorities: "certs.ro/ca/ca.crt"
      xpack.security.transport.ssl.verification_mode: certificate
      
      # License and passwords
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:-elastic}"
      bootstrap.password: "${ELASTIC_PASSWORD:-elastic}"
      LICENSE: "trial"
      xpack.license.self_generated.type: "trial"      
    
    # Simplified command that just waits for certs and starts ES
    command: |
      bash -c '
        until [ -f /usr/share/elasticsearch/config/certs.ro/elasticsearch/elasticsearch.crt ] && [ -f /usr/share/elasticsearch/config/certs.ro/setup.complete ]; do
          echo "Waiting for certificates..."
          sleep 5
        done
        
        /usr/share/elasticsearch/bin/elasticsearch-keystore create --silent
        echo "${ELASTIC_PASSWORD:-elastic}" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password
        exec /usr/local/bin/docker-entrypoint.sh elasticsearch
      '
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 10s
      retries: 120    
    volumes:
      - 'certs:/usr/share/elasticsearch/config/certs.ro:ro'
      - '/workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack/es-agent:ro'
    networks:
      - name: elastic
    published_ports:
      - 0.0.0.0:9200:9200/tcp 

  - name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.2
    pre_build_image: true
    hostname: kibana
    entrypoint: []
    working_dir: /usr/share/kibana
    command: >-
      bash -c '
        bash -x /usr/share/kibana/pre-stack/es-agent/kibana-startup.sh
        sleep 5
      '
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/kibana/pre-stack/es-agent:ro
    mem_limit: ${MEM_LIMIT:-512m}
    published_ports:
      - 0.0.0.0:5601:5601/tcp  
    networks:
      - name: elastic
    env:
      # LICENSE: trial
      SERVER_HOST: "0.0.0.0"
      SERVER_NAME: "kibana"
      SERVER_PUBLICBASEURL: "https://localhost:5601"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: "/usr/share/kibana/config/certs/kibana/kibana.crt"
      SERVER_SSL_KEY: "/usr/share/kibana/config/certs/kibana/kibana.key"
      SERVER_SSL_CERTIFICATEAUTHORITIES: "/usr/share/kibana/config/certs/ca/ca.crt"
      ELASTICSEARCH_HOSTS: "https://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "kibana_system"
      ELASTICSEARCH_PASSWORD: "${KIBANA_PASSWORD:-elastic}"
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: "/usr/share/kibana/config/certs/ca/ca.crt"
      ELASTICSEARCH_SSL_VERIFICATIONMODE: "certificate"
      XPACK_SECURITY_ENCRYPTIONKEY: "xkb123456789012345678901234567890"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "xkb123456789012345678901234567890"
      XPACK_REPORTING_ENCRYPTIONKEY: "xkb123456789012345678901234567890"
      XPACK_FLEET_ENABLED: "true"
      XPACK_FLEET_AGENTS_ENABLED: "true"
      FLEET_SERVER_HOST: "${FLEET_HOST:-https://fleet-server:8220}"
      FLEET_SERVER_POLICY_ID: "fleet-server-policy"
      XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS[0]: "https://fleet-server:8220"
      KIBANA_FLEET_SETUP: "1"
      KIBANA_FLEET_HOST: "https://kibana:5601"
      KIBANA_FLEET_USERNAME: "kibana_system"
      KIBANA_FLEET_PASSWORD: "${KIBANA_PASSWORD:-elastic}"
      KIBANA_FLEET_CA: "/usr/share/kibana/config/certs/ca/ca.crt"
      XPACK_SECURITY_LOGINASSISTANCEMESSAGE: "Default credentials: elastic / elastic"
      XPACK_SECURITY_SESSION_IDLETIMEOUT: "1h"
      TELEMETRY_ENABLED: "false"
      XPACK_REPORTING_CSV_MAXSIZEBYTES: "10485760"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I --cacert config/certs/ca/ca.crt https://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Add Fleet Server platform
  - name: fleet-server
    image: docker.elastic.co/beats/elastic-agent:8.15.2
    pre_build_image: true
    hostname: fleet-server
    platform: linux/amd64
    container_name: fleet-server
    restart_policy: "always"
    # restart_retries: "3"
    user: root
    command: elastic-agent container
    volumes:
      - certs:/usr/share/elastic-agent/config/certs:ro
    published_ports:
      - 0.0.0.0:8220:8220/tcp
    networks:
      - name: elastic
    env:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: "https://elasticsearch:9200"
      FLEET_SERVER_ELASTICSEARCH_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      FLEET_SERVER_CERT: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.crt"
      FLEET_SERVER_CERT_KEY: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.key"
      FLEET_SERVER_HOST: "0.0.0.0"
      FLEET_SERVER_PORT: "8220"
      FLEET_SERVER_POLICY_ID: "fleet-server-policy"
      FLEET_ENROLL: "1"
      FLEET_URL: "https://fleet-server:8220"
      FLEET_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_FLEET_SETUP: "1"
      KIBANA_FLEET_HOST: "https://kibana:5601"
      KIBANA_HOST: "https://kibana:5601"
      KIBANA_FLEET_USERNAME: "elastic"
      KIBANA_FLEET_PASSWORD: "${KIBANA_PASSWORD:-elastic}"
      KIBANA_FLEET_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      ELASTICSEARCH_HOST: "https://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTIC_PASSWORD:-elastic}"
      ELASTICSEARCH_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_REQUEST_RETRY_SLEEP: "5s"
      KIBANA_REQUEST_RETRY_COUNT: "60"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I --cacert /usr/share/elastic-agent/config/certs/ca/ca.crt https://fleet-server:8220 | grep -q 'HTTP/2 404'"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Test instance for es-agent deployment
  - name: instance
    image: geerlingguy/docker-ubuntu2004-ansible
    pre_build_image: true
    privileged: true
    packages:
      - python3
      - python3-pip
      - curl
      - ca-certificates
    command: |
      bash -c '
        apt update 
        apt install -y curl
        sleep infinity
      '
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - /workspaces/elastic-stack-fleet-docker-compose/pre-stack/es-agent:/usr/share/elasticsearch/pre-stack:ro
    networks:
      - name: elastic
    groups:
      - elastic_agents
    env:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: "https://elasticsearch:9200"
      FLEET_SERVER_ELASTICSEARCH_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      FLEET_SERVER_CERT: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.crt"
      FLEET_SERVER_CERT_KEY: "/usr/share/elastic-agent/config/certs/fleet-server/fleet-server.key"
      FLEET_SERVER_HOST: "0.0.0.0"
      FLEET_SERVER_PORT: "8220"
      FLEET_SERVER_POLICY_ID: "fleet-server-policy"
      FLEET_ENROLL: "1"
      FLEET_URL: "https://fleet-server:8220"
      FLEET_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_FLEET_SETUP: "1"
      KIBANA_FLEET_HOST: "https://kibana:5601"
      KIBANA_HOST: "https://kibana:5601"
      KIBANA_FLEET_USERNAME: "kibana_system"
      KIBANA_FLEET_PASSWORD: "${KIBANA_PASSWORD:-elastic}"
      KIBANA_FLEET_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      ELASTICSEARCH_HOST: "https://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:-elastic}"
      ELASTICSEARCH_PASSWORD: "${ELASTIC_PASSWORD:-elastic}"
      ELASTICSEARCH_CA: "/usr/share/elastic-agent/config/certs/ca/ca.crt"
      KIBANA_REQUEST_RETRY_SLEEP: "5s"
      KIBANA_REQUEST_RETRY_COUNT: "60"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
  inventory:
    group_vars:
      all:
        elastic_password: elastic
        kibana_password: elastic
        fleet_host: https://fleet-server:8220
        es_host: https://elasticsearch:9200
        kibana_host: https://kibana:5601
        ca_cert: /usr/share/elasticsearch/config/certs/ca/ca.crt

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    # - converge  # Commented out as requested
