---
- name: Converge
  hosts: elastic_agents
  tasks:
    - name: Include es-agent role
      include_role:
        name: es-agent
      vars:
        elastic_stack_version: "{{ lookup('env', 'STACK_VERSION') }}"
        fleet_host: "{{ fleet_host }}"
        elasticsearch_host: "{{ es_host }}"
        elastic_password: "{{ elastic_password }}"
        ca_cert: "{{ ca_cert }}"
