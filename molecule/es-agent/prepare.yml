---
- name: Create shared directories
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create shared certificates directory
      file:
        path: "{{ molecule_ephemeral_directory }}/shared-certs"
        state: directory
        mode: '0777'
      register: certs_dir

    - name: Debug shared directory
      debug:
        var: certs_dir

- name: Prepare test environment
  hosts: elastic_agents
  gather_facts: false
  tasks:
    - name: Debug - Check container status
      command: docker ps -a
      register: docker_ps
      changed_when: false
      delegate_to: localhost

    - name: Debug - Show container status
      debug:
        var: docker_ps.stdout_lines

    - name: Wait for elastic-setup to complete
      command: docker logs -f elastic-setup
      register: setup_logs
      changed_when: false
      delegate_to: localhost

    - name: Debug - Show setup logs
      debug:
        var: setup_logs.stdout_lines
      when: setup_logs is defined

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - curl
          - ca-certificates
        state: present
        update_cache: yes
      become: true

