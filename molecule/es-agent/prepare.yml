---
- name: Prepare
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for elastic-setup container to complete
      command: docker logs elastic-setup
      register: setup_logs
      until: "'Setting kibana_system password' in setup_logs.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Display elastic-setup logs
      debug:
        msg: "{{ setup_logs.stdout_lines }}"

    - name: Wait for certificates to be generated
      command: docker exec elasticsearch ls -la /usr/share/elasticsearch/config/certs.ro/elasticsearch/elasticsearch.crt
      register: cert_check
      until: cert_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for Elasticsearch to be ready
      uri:
        url: "https://localhost:9200/_cluster/health"
        method: GET
        user: elastic
        password: elastic
        force_basic_auth: true
        return_content: yes
        validate_certs: no
        status_code: [200, 401, 503]
      register: result
      until: >
        result.status == 200 and
        'status' in (result.content | from_json) and
        ((result.content | from_json).status == 'green' or
         (result.content | from_json).status == 'yellow')
      retries: 30
      delay: 10

    - name: Display Elasticsearch health
      debug:
        msg: "Elasticsearch health: {{ result.content }}"

    - name: Wait for Kibana to be ready
      uri:
        url: "https://localhost:5601/api/status"
        method: GET
        user: elastic
        password: elastic
        force_basic_auth: true
        return_content: yes
        validate_certs: no
        status_code: [200, 401, 503]
      register: result
      until: >
        result.status == 200 and
        'status' in (result.content | from_json) and
        (result.content | from_json).status.overall.level == 'available'
      retries: 30
      delay: 10

    - name: Display Kibana status
      debug:
        msg: "Kibana status: {{ result.content }}"

    - name: Wait for Fleet Server to be ready
      uri:
        url: "https://localhost:8220/api/status"
        method: GET
        user: elastic
        password: elastic
        force_basic_auth: true
        return_content: yes
        validate_certs: no
        status_code: [200, 404, 503]
      register: result
      until: result.status in [200, 404]
      retries: 30
      delay: 10

    - name: Display Fleet Server status
      debug:
        msg: "Fleet Server status: {{ result }}"

- name: Prepare test environment
  hosts: elastic_agents
  gather_facts: false
  tasks:
    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - curl
          - ca-certificates
        state: present
        update_cache: yes
      become: true

    - name: Debug service info
      debug:
        msg: "Service {{ item.name }} info - URL: {{ item.url }}"
      loop:
        - { name: "Elasticsearch", url: "https://elasticsearch:9200" }
        - { name: "Kibana", url: "https://kibana:5601" }
        - { name: "Fleet Server", url: "https://fleet-server:8220" }
