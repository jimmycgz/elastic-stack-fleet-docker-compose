---
- name: Prepare
  hosts: localhost
  gather_facts: false
  tasks: []

- name: Prepare test environment
  hosts: elastic_agents
  become: true
  gather_facts: false
  tasks:
    - name: Wait for apt lock release
      shell: |
        while lsof /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock release..."
          sleep 5
        done
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
      register: apt_update
      retries: 5
      delay: 10
      until: apt_update is success

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - curl
          - ca-certificates
          - lsof
          - apt-transport-https
          - gnupg-agent
          - software-properties-common
        state: present
      register: apt_install
      retries: 5
      delay: 10
      until: apt_install is success

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - python3-docker
        state: present
        update_cache: yes
      register: docker_install
      retries: 5
      delay: 10
      until: docker_install is success

    - name: Install Docker Python package
      pip:
        name: 
          - docker
          - docker-compose
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes
      register: docker_service
      retries: 5
      delay: 10
      until: docker_service is success

    - name: Ensure Docker socket has correct permissions
      file:
        path: /var/run/docker.sock
        mode: '0666'

    - name: Remove existing elastic network if exists
      docker_network:
        name: elastic
        state: absent
        force: yes
      ignore_errors: yes

    - name: Create elastic network
      docker_network:
        name: elastic
        driver: bridge
        state: present
      register: network_result

    - name: Debug network creation
      debug:
        var: network_result

    - name: Verify Docker is operational
      command: docker ps
      changed_when: false

    - name: Debug service info
      debug:
        msg: "Service {{ item.name }} info - URL: {{ item.url }}"
      loop:
        - name: "Elasticsearch"
          url: "{{ lookup('env', 'ELASTICSEARCH_HOST') | default('https://elasticsearch:9200', true) }}"
        - name: "Kibana"
          url: "{{ lookup('env', 'KIBANA_FLEET_HOST') | default('https://kibana:5601', true) }}"
        - name: "Fleet Server"
          url: "{{ lookup('env', 'FLEET_HOST') | default('https://fleet-server:8220', true) }}"