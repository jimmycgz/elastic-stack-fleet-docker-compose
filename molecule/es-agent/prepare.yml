---
- name: Prepare
  hosts: localhost
  gather_facts: false
  tasks: []

- name: Prepare test environment
  hosts: elastic_agents
  gather_facts: false
  tasks:
    - name: Wait for apt lock release
      shell: |
        while lsof /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock release..."
          sleep 5
        done
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
      register: apt_update
      retries: 5
      delay: 10
      until: apt_update is success

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - curl
          - ca-certificates
        state: present
      register: apt_install
      retries: 5
      delay: 10
      until: apt_install is success

    - name: Debug service info
      debug:
        msg: "Service {{ item.name }} info - URL: {{ item.url }}"
      loop:
        - name: "Elasticsearch"
          url: "{{ lookup('env', 'ELASTICSEARCH_HOST') }}"
        - name: "Kibana"
          url: "{{ lookup('env', 'KIBANA_FLEET_HOST') }}"
        - name: "Fleet Server"
          url: "{{ lookup('env', 'FLEET_HOST') }}"