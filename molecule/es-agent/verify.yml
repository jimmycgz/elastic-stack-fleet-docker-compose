---
- name: Verify es-agent deployment
  hosts: elastic_agents
  gather_facts: true
  tasks:
    - name: Check if elastic-agent process is running
      shell: |
        if command -v pgrep >/dev/null 2>&1; then
          pgrep -f "elastic-agent"
        else
          ps aux | grep "[e]lastic-agent" | awk '{print $2}'
        fi
      register: agent_process
      changed_when: false
      failed_when: agent_process.rc != 0

    - name: Check agent status using binary
      command: elastic-agent status
      register: agent_status
      changed_when: false
      failed_when: >
        'Fleet Server: Connected' not in agent_status.stdout or
        'State: HEALTHY' not in agent_status.stdout

    - name: Verify agent version matches stack version
      command: elastic-agent version
      register: agent_version
      changed_when: false
      failed_when: >
        lookup('env', 'STACK_VERSION') not in agent_version.stdout

    - name: Display verification results
      debug:
        msg: |
          Agent Process ID: {{ agent_process.stdout }}
          Agent Status: {{ agent_status.stdout_lines | to_nice_json }}
          Agent Version: {{ agent_version.stdout_lines | to_nice_json }}
      when: 
        - agent_process is success
        - agent_status is success
        - agent_version is success

    - name: Verify agent can reach Fleet Server
      uri:
        url: "{{ fleet_host }}/api/status"
        validate_certs: no
        return_content: yes
      register: fleet_connection
      failed_when: fleet_connection.status not in [200, 404]
